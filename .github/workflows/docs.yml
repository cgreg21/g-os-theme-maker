name: Build documentation

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - "docs/gnome-51/**"
      - "docs/guide-theme-gnome.md"
      - "docs/guide.css"
      - "scripts/build-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install document tools
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends pandoc weasyprint
      - name: Generate and publish current documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Publication attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main

            bash scripts/build-docs.sh
            git add docs/guide-theme-gnome.epub docs/guide-theme-gnome.pdf

            if git diff --cached --quiet; then
              echo "Documentation already up to date."
              exit 0
            fi

            git commit -m "docs: publish generated formats"
            if git push origin HEAD:main; then
              echo "Generated documentation published."
              exit 0
            fi

            echo "The main branch changed during publication; retrying from its latest commit."
          done

          echo "Could not publish generated documentation after 5 attempts."
          exit 1
