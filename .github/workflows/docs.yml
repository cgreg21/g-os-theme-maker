name: Build documentation

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - "docs/gnome-51/**"
      - "docs/guide-theme-gnome.md"
      - "docs/guide.css"
      - "scripts/build-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install document tools
        run: |
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo apt-get install -y --no-install-recommends pandoc weasyprint
      - name: Generate EPUB and PDF
        run: bash scripts/build-docs.sh
      - name: Commit generated documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/guide-theme-gnome.epub docs/guide-theme-gnome.pdf
          if git diff --cached --quiet; then
            echo "Documentation already up to date."
            exit 0
          fi
          git commit -m "docs: publish generated formats"
          git push
